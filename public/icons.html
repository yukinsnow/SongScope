<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>曲镜 · 图标候选</title><style>*{box-sizing:border-box}body{margin:0;background:#11191e;color:#e1e9e7;font-family:system-ui,sans-serif;padding:48px 32px}main{max-width:1000px;margin:auto}small{color:#a7bcb5;letter-spacing:3px;font-size:11px}h1{font-size:30px;margin:12px 0}header p{color:#99aaa9;font-size:14px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:36px 0}.option{background:#192329;color:inherit;border:1px solid #34434a;border-radius:14px;text-align:left;padding:24px;cursor:pointer}.option:hover,.option.selected{border-color:#bddbd2;background:#23343b}.large{width:112px;height:112px;display:block;margin:0 auto 28px}h2{font-size:16px;margin:8px 0}p{color:#8eaaa5;font-size:12px}.sizes{display:flex;gap:16px;align-items:center;margin-top:24px}#choice{min-height:30px;color:#bddbd2}footer{font-size:12px;color:#7e9692;line-height:1.8}a{color:#bddbd2}@media(max-width:700px){body{padding:28px 18px}.grid{grid-template-columns:repeat(2,1fr)}.option{padding:18px}.large{width:82px;height:82px}h1{font-size:24px}}</style><main><header><small>SONGSCOPE / BRAND EXPLORATION</small><h1>少一点装饰，多一点识别。</h1><p>四个简约方向 · 统一单色 · 无渐变、无高光、无拟物<br>点击预选，确认后在聊天中回复编号。尚未替换应用图标。</p></header><div class="grid"><button class="option" data-choice="A" onclick="choose('A')"><img class="large" src="./brand/candidates/A.svg"/><h2>A · 轨迹</h2><p>轨道块 + 走带线</p><div class="sizes"><img width="32" src="./brand/candidates/A.svg"/><img width="20" src="./brand/candidates/A.svg"/><img width="16" src="./brand/candidates/A.svg"/></div></button><button class="option" data-choice="B" onclick="choose('B')"><img class="large" src="./brand/candidates/B.svg"/><h2>B · 字标</h2><p>单线 S / SongScope</p><div class="sizes"><img width="32" src="./brand/candidates/B.svg"/><img width="20" src="./brand/candidates/B.svg"/><img width="16" src="./brand/candidates/B.svg"/></div></button><button class="option" data-choice="C" onclick="choose('C')"><img class="large" src="./brand/candidates/C.svg"/><h2>C · 取景</h2><p>取景框 + 片段</p><div class="sizes"><img width="32" src="./brand/candidates/C.svg"/><img width="20" src="./brand/candidates/C.svg"/><img width="16" src="./brand/candidates/C.svg"/></div></button><button class="option" data-choice="D" onclick="choose('D')"><img class="large" src="./brand/candidates/D.svg"/><h2>D · 声形</h2><p>极简音频线条</p><div class="sizes"><img width="32" src="./brand/candidates/D.svg"/><img width="20" src="./brand/candidates/D.svg"/><img width="16" src="./brand/candidates/D.svg"/></div></button></div><p id="choice">选择你喜欢的方向：A / B / C / D</p><footer>下方小图分别为 32 / 20 / 16 像素预览。选择仅保存在本机。<br><a href="./">返回曲镜</a></footer></main><script>function choose(k){localStorage.setItem('songscope-icon-choice',k);document.querySelectorAll('.option').forEach(e=>e.classList.toggle('selected',e.dataset.choice===k));document.getElementById('choice').textContent='已预选 '+k+' · 请在聊天中回复这个编号，尚未应用。'}const k=localStorage.getItem('songscope-icon-choice');if(k)choose(k);</script></html>
