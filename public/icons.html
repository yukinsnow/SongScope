<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SongScope · 去镜片图标候选</title><style>*{box-sizing:border-box}body{margin:0;background:#11191e;color:#e1e9e7;font-family:system-ui,sans-serif;padding:48px 32px}main{max-width:1000px;margin:auto}small{color:#a7bcb5;letter-spacing:3px;font-size:11px}h1{font-size:30px;margin:12px 0}header p{color:#99aaa9;font-size:14px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:36px 0}.option{background:#192329;color:inherit;border:1px solid #34434a;border-radius:14px;text-align:left;padding:24px;cursor:pointer}.option:hover,.option.selected{border-color:#bddbd2;background:#23343b}.large{width:132px;height:132px;display:block;margin:0 auto 28px}h2{font-size:16px;margin:8px 0}p{color:#8eaaa5;font-size:12px}.sizes{display:flex;gap:16px;align-items:center;margin-top:24px}#choice{min-height:30px;color:#bddbd2}footer{font-size:12px;color:#7e9692;line-height:1.8}a{color:#bddbd2}@media(max-width:700px){body{padding:28px 18px}.grid{grid-template-columns:repeat(2,1fr)}.option{padding:18px}.large{width:82px;height:82px}h1{font-size:24px}}@media(max-width:700px){.grid{grid-template-columns:1fr}.option{display:grid;grid-template-columns:90px 1fr;column-gap:20px}.large{grid-row:1/4;margin:0}.sizes{margin-top:10px}}</style><main><header><small>SONGSCOPE / REFINED ICONS</small><h1>保留走带与片段，去掉镜片。</h1><p>沿用你喜欢的内部设计与三色搭配。<br>没有圆环、反光、同心线与渐变。本页为历史方案，已选用第三轮 01 号手写音乐 Logo。</p></header><div class="grid"><button class="option" data-choice="E" onclick="choose('E')"><img class="large" src="./brand/candidates/E.svg"/><h2>E · 原结构</h2><p>保留原来的交错关系，只去掉镜片</p><div class="sizes"><img width="32" src="./brand/candidates/E.svg"/><img width="20" src="./brand/candidates/E.svg"/><img width="16" src="./brand/candidates/E.svg"/></div></button><button class="option" data-choice="F" onclick="choose('F')"><img class="large" src="./brand/candidates/F.svg"/><h2>F · 整齐版</h2><p>走带线独立在左，片段整齐排列</p><div class="sizes"><img width="32" src="./brand/candidates/F.svg"/><img width="20" src="./brand/candidates/F.svg"/><img width="16" src="./brand/candidates/F.svg"/></div></button><button class="option" data-choice="G" onclick="choose('G')"><img class="large" src="./brand/candidates/G.svg"/><h2>G · 圆润版</h2><p>保留交错，比例更饱满、线条更清楚</p><div class="sizes"><img width="32" src="./brand/candidates/G.svg"/><img width="20" src="./brand/candidates/G.svg"/><img width="16" src="./brand/candidates/G.svg"/></div></button></div><p id="choice">选择方向：E / F / G</p><footer>下方小图为 32 / 20 / 16 像素预览；预选只保存在本机。<br><a href="./">返回SongScope</a></footer></main><script>function choose(k){localStorage.setItem('songscope-icon-choice',k);document.querySelectorAll('.option').forEach(e=>e.classList.toggle('selected',e.dataset.choice===k));document.getElementById('choice').textContent='已预选 '+k+' · 请在聊天中回复这个编号，尚未应用。'}const k=localStorage.getItem('songscope-icon-choice');if(['E','F','G'].includes(k))choose(k);</script></html>
